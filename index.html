<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Soir de match · Remontées terrain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#000; --card:#121212; --card2:#1b1b1b; --line:#2a2a2a; --text:#fff; --muted:#9a9a9a; --accent:#ff6a13; --red:#e5243b; --blue:#2f9bff; --green:#3ccf6e; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--text); font-family: Inter, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  button { font: inherit; cursor: pointer; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 22px 18px calc(28px + env(safe-area-inset-bottom)); }
  .kicker { color: var(--accent); font-weight: 800; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; }
  h1 { font-weight: 900; font-size: 40px; line-height: .98; margin: 8px 0 20px; text-transform: uppercase; letter-spacing: -.01em; }
  h1 .acc { color: var(--accent); }
  .tile { display:flex; justify-content:space-between; align-items:center; padding: 20px 22px; margin-bottom: 12px; background: var(--card); border-radius: 18px; text-decoration:none; }
  .tile b { font-weight: 900; font-size: 22px; text-transform: uppercase; }
  .tile span { color: var(--muted); font-size: 14px; }
  .btn { display:block; width:100%; border:0; border-radius: 16px; padding: 18px; font-weight: 900; font-size: 18px; text-transform: uppercase; letter-spacing:.02em; background: var(--accent); color: #000; }
  .btn[disabled] { opacity: .35; }
  .btn.ghost { background: var(--card); color: var(--text); }
  .btn.small { display:inline-block; width:auto; padding: 10px 14px; font-size: 13px; border-radius: 12px; }
  .photo { display:flex; align-items:center; justify-content:center; gap:12px; height: 120px; border: 2px dashed #333; border-radius: 18px; color: var(--muted); font-weight: 700; margin-bottom: 14px; overflow:hidden; position:relative; }
  .photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .photo input { display:none; }
  textarea { width:100%; min-height: 110px; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 16px; padding: 14px; font: inherit; font-size: 17px; resize: vertical; }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 2px 16px; }
  .label { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin: 6px 2px 10px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-bottom: 16px; }
  .chip { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 10px 14px; font-weight: 700; font-size: 14px; }
  .chip.on { background: var(--text); color: #000; border-color: var(--text); }
  .note { color: var(--muted); font-size: 13px; text-align:center; margin-top: 18px; }
  .result { background: var(--card); border-radius: 18px; padding: 20px; margin: 10px 0 16px; }
  .result .big { font-weight: 900; font-size: 26px; margin: 4px 0 10px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { display:inline-block; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 4px 10px; background:#2a2a2a; color:#fff; }
  .t-urgent { background:#fff; color: var(--red); }
  .t-inc { background:#ffb020; color:#000; }
  .t-act { background: var(--blue); color:#000; }
  .t-idee { background: var(--green); color:#000; }
  .t-part { background: transparent; border: 1px solid #fff; }
  .t-done { background:#333; color:#bbb; }
  .spin { display:inline-block; width:16px; height:16px; border:3px solid #444; border-top-color: var(--accent); border-radius:50%; animation: sp 1s linear infinite; vertical-align: -3px; margin-right:8px; }
  @keyframes sp { to { transform: rotate(360deg); } }

  /* Écran central */
  .ecran { display:grid; grid-template-columns: minmax(0,1fr) 400px; grid-template-rows: auto minmax(0,1fr); gap: 18px; height: 100vh; padding: 18px; }
  .ecran > header { grid-column: 1 / -1; display:flex; align-items:center; gap: 16px; }
  .ecran > header .title { margin-right:auto; }
  .ecran > header .title h2 { margin: 2px 0 0; font-weight: 900; font-size: 34px; text-transform: uppercase; }
  .count { display:flex; align-items:center; gap: 10px; background: var(--card); border-radius: 20px; padding: 12px 18px; }
  .count b { font-weight: 900; font-size: 40px; line-height:1; }
  .count span { font-weight: 800; font-size: 13px; text-transform: uppercase; letter-spacing:.06em; color:#ddd; max-width: 130px; }
  .count.main { background: var(--accent); color:#000; } .count.main span { color:#000; }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .feed { overflow-y: auto; min-height: 0; padding-right: 6px; scroll-behavior: smooth; }
  .feed::-webkit-scrollbar { width: 8px; } .feed::-webkit-scrollbar-thumb { background:#333; border-radius: 8px; }
  .item { display:flex; gap: 16px; align-items:center; background: var(--card); border-radius: 20px; padding: 14px 18px 14px 14px; margin-bottom: 12px; animation: pop .5s ease-out; }
  .item.urgent { background: var(--red); }
  .item.done { opacity: .45; }
  .item .thumb { flex: 0 0 96px; height: 96px; border-radius: 14px; background: #262626; overflow:hidden; display:flex; align-items:center; justify-content:center; color:#777; font-size: 11px; text-align:center; font-weight:700; }
  .item .thumb img { width:100%; height:100%; object-fit:cover; }
  .item .mid { flex: 1; min-width: 0; }
  .item .sum { font-weight: 900; font-size: 24px; margin: 6px 0 4px; line-height: 1.15; }
  .item .meta { color: #cfcfcf; font-size: 16px; } .item .meta b { color:#fff; }
  .item .time { font-weight: 900; font-size: 28px; }
  @keyframes pop { from { transform: translateY(-14px) scale(.98); opacity: 0; } to { transform:none; opacity:1; } }
  .side { display:flex; flex-direction:column; gap: 14px; min-height: 0; }
  .zones { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .zone { background: var(--card); border-radius: 16px; padding: 12px 14px; position:relative; overflow:hidden; min-height: 92px; }
  .zone .fill { position:absolute; left:0; right:0; bottom:0; background: rgba(255,106,19,.28); transition: height .6s; }
  .zone b { position:relative; display:block; font-weight: 800; font-size: 15px; }
  .zone i { position:relative; font-style: normal; font-weight: 900; font-size: 34px; }
  .qr { margin-top:auto; background:#fff; color:#000; border-radius: 20px; padding: 16px; display:flex; gap: 14px; align-items:center; }
  .qr svg { width: 150px; height: 150px; flex: 0 0 150px; }
  .qr h3 { margin:0 0 6px; font-weight: 900; font-size: 26px; text-transform: uppercase; }
  .empty { color: var(--muted); font-size: 22px; padding: 40px 10px; }

  /* Mon poste */
  .alert { background: var(--accent); color:#000; border-radius: 16px; padding: 14px 16px; font-weight: 800; margin-bottom: 14px; animation: pop .4s; }
  .pitem { background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 10px; }
  .pitem.urgent { border-left: 6px solid var(--red); }
  .pitem.done { opacity: .45; }
  .pitem .sum { font-weight: 800; font-size: 18px; margin: 8px 0 6px; }
  .pitem .meta { color: var(--muted); font-size: 14px; margin-bottom: 10px; }

  /* Bilan */
  .tabs { display:flex; gap: 8px; margin: 14px 0; }
  .bcard { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 12px; }
  .bcard h3 { margin: 0 0 8px; font-weight: 900; font-size: 18px; text-transform: uppercase; }
  .bcard p, .bcard li { color: #ddd; font-size: 15px; line-height: 1.45; }
  .thumbs { display:flex; gap: 8px; margin: 10px 0; flex-wrap: wrap; }
  .thumbs figure { margin:0; width: 92px; } .thumbs img { width: 92px; height: 70px; object-fit: cover; border-radius: 10px; }
  .thumbs figcaption { font-size: 11px; color: var(--muted); }
  input[type=password], select { width:100%; background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 14px; padding: 14px; font: inherit; font-size: 16px; margin-bottom: 12px; }
  .row { display:flex; gap: 10px; } .row > * { flex:1; }
  .banner { background:#1d1d1d; color:#ddd; font-size: 12px; text-align:center; padding: 6px; }
</style>
</head>
<body>
<div id="app"></div>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +

function upsert(r) { const i = rows.findIndex((x) => x.id === r.id); if (i >= 0) rows[i] = { ...rows[i], ...r }; else rows.unshift(r); }
function emit(evt) { listeners.forEach((f) => f(evt)); }

let api;
if (!DEMO) {
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  const sb = createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
  const call = async (body) => {
    const { data, error } = await sb.functions.invoke("soir", { body });
    if (error) throw error; return data;
  };
  api = {
    async load() { const { data } = await sb.from("signalements").select("*").order("created_at", { ascending: false }).limit(400); rows = data ?? []; },
    live() {
      sb.channel("signalements").on("postgres_changes", { event: "*", schema: "public", table: "signalements" }, (p) => {
        if (p.eventType === "DELETE") rows = rows.filter((r) => r.id !== p.old.id); else upsert(p.new);
        emit({ type: p.eventType, row: p.new, old: p.old });
      }).subscribe();
      setInterval(async () => { await api.load(); emit({ type: "SYNC" }); }, 20000); // filet de sécurité si le temps réel décroche
    },
    async envoyer({ texte, zone, role, file }) {
      let photo_url = null;
      if (file) {
        const blob = await reduire(file);
        const path = `${crypto.randomUUID()}.jpg`;
        const up = await sb.storage.from("photos").upload(path, blob, { contentType: "image/jpeg" });
        if (!up.error) photo_url = sb.storage.from("photos").getPublicUrl(path).data.publicUrl;
      }
      const { data, error } = await sb.from("signalements").insert({ texte, zone, role, photo_url }).select().single();
      if (error) throw error; upsert(data); return data;
    },
    classer: (id) => call({ action: "classer", id }),
    async traiter(id, statut) { await sb.from("signalements").update({ statut, traite_at: statut === "traite" ? new Date().toISOString() : null }).eq("id", id); },
    bilan: () => call({ action: "bilan" }),
    admin: (op, password) => call({ action: "admin", op, password }),
  };
} else {
  // Mode démo hors ligne : tout reste dans ce navigateur (sert aux tests et de secours).
  const fake = (r) => {
    const t = (r.texte || "").toLowerCase();
    const part = ["boisson", "banque", "énergie", "automobile", "assurance"].find((p) => t.includes(p));
    const cat = part || /stand|logo|kakemono|activation/.test(t) ? "Activation partenaire" : t.startsWith("idée") ? "Idée" : "Incident";
    const urg = /chute|panne|bloqu|secours|bless/.test(t) ? "Urgent" : cat === "Idée" ? "Débrief" : "Ce soir";
    return { analyse_ia: "ok", categorie: cat, sous_categorie: cat === "Incident" ? (/attente|file/.test(t) ? "Accueil et attente" : "Technique") : cat === "Idée" ? "Ambiance" : "À corriger",
      partenaire: part ? "Partenaire " + part : null, urgence: urg,
      responsable: cat === "Activation partenaire" ? "Responsable sponsoring" : /attente|file|accueil/.test(t) ? "Responsable accueil" : /billet/.test(t) ? "Responsable billetterie" : cat === "Idée" ? "Responsable event" : "Responsable opérations",
      resume: (r.texte || "Signalement avec photo").replace(/\.$/, "").slice(0, 80), personne_visible: false, masque: false };
  };
  api = {
    async load() {},
    live() {},
    async envoyer({ texte, zone, role, file }) {
      const r = { id: crypto.randomUUID(), created_at: new Date().toISOString(), texte, zone, role, statut: "nouveau", analyse_ia: "en_cours",
        photo_url: file ? URL.createObjectURL(file) : null };
      upsert(r); emit({ type: "INSERT", row: r }); return r;
    },
    async classer(id) {
      await new Promise((s) => setTimeout(s, 1200));
      const r = rows.find((x) => x.id === id); const c = fake(r); upsert({ id, ...c }); emit({ type: "UPDATE", row: { ...r, ...c } }); return c;
    },
    async traiter(id, statut) { upsert({ id, statut }); emit({ type: "UPDATE", row: rows.find((x) => x.id === id) }); },
    async bilan() {
      const parts = [...new Set(rows.filter((r) => r.partenaire).map((r) => r.partenaire))];
      const resps = [...new Set(rows.filter((r) => r.responsable).map((r) => r.responsable))];
      return { partenaires: parts.map((p) => ({ partenaire: p, compte_rendu: rows.filter((r) => r.partenaire === p).map((r) => `${hm(r.created_at)} : ${r.resume}.`).join(" ") })),
        responsables: resps.map((p) => ({ responsable: p, actions: ["Action 1 (mode démo)", "Action 2 (mode démo)", "Action 3 (mode démo)"] })) };
    },
    async admin(op) {
      if (op === "vider") { rows = []; emit({ type: "SYNC" }); return { ok: true }; }
      if (op === "injecter") {
        const T = ["Scanners de billets en panne porte B.", "Le kakemono du partenaire boisson est tombé près de l'entrée.", "Liquide renversé dans la coursive est, risque de chute.",
          "15 minutes d'attente à la buvette du niveau 2.", "Le stand du partenaire banque est vide depuis la mi-temps.", "Idée : faire chanter les tribunes pendant le temps mort.",
          "L'écran LED derrière le panier est éteint.", "Logo du partenaire assurance mal placé sur le mur des loges.", "Porte de secours bloquée par des caisses, coursive ouest.",
          "Plus de serviettes en loge 12.", "La voiture du partenaire automobile est bien exposée sur le parvis.", "Poubelles pleines près de la buvette nord.",
          "Idée : un point d'eau gratuit pour les familles.", "Le jeu concours du partenaire énergie a bien tourné.", "File d'attente au vestiaire porte C."];
        T.forEach((texte, i) => { const r = { id: crypto.randomUUID(), created_at: new Date(Date.now() - (T.length - i) * 90000).toISOString(), texte, zone: ZONES[i % 8], statut: "nouveau" }; upsert({ ...r, ...fake(r) }); });
        rows.sort((a, b) => b.created_at.localeCompare(a.created_at)); emit({ type: "SYNC" }); return { ok: true };
      }
    },
  };
}

async function reduire(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", 0.8));
  } catch { return file; }
}

// ---------- Morceaux d'interface ----------
function tags(r) {
  const out = [];
  if (r.statut === "traite") out.push(`<span class="tag t-done">Traité</span>`);
  if (r.urgence === "Urgent" && r.statut !== "traite") out.push(`<span class="tag t-urgent">URGENT</span>`);
  if (r.categorie) out.push(`<span class="tag ${r.categorie === "Incident" ? "t-inc" : r.categorie === "Idée" ? "t-idee" : "t-act"}">${esc(r.categorie)} · ${esc(r.sous_categorie)}</span>`);
  if (r.partenaire) out.push(`<span class="tag t-part">${esc(r.partenaire)}</span>`);
  return `<div class="tags">${out.join("")}</div>`;
}
const visiblePhoto = (r) => r.photo_url && r.analyse_ia === "ok" && !r.personne_visible && !r.masque;
function thumb(r) {
  if (visiblePhoto(r)) return `<div class="thumb"><img src="${esc(r.photo_url)}" alt=""></div>`;
  if (r.photo_url && r.analyse_ia !== "ok") return `<div class="thumb">Photo en analyse</div>`;
  if (r.photo_url) return `<div class="thumb">Photo masquée</div>`;
  return `<div class="thumb">Sans photo</div>`;
}
function order(list) {
  return [...list].sort((a, b) => {
    const ua = a.urgence === "Urgent" && a.statut !== "traite" ? 0 : 1, ub = b.urgence === "Urgent" && b.statut !== "traite" ? 0 : 1;
    const da = a.statut === "traite" ? 1 : 0, db = b.statut === "traite" ? 1 : 0;
    return ua - ub || da - db || b.created_at.localeCompare(a.created_at);
  });
}

      [0, 0.18].forEach((t) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.25, ctx.currentTime + t); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.15); o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.16); });
    } catch {}
    try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {}

    const cols = ["created_at", "zone", "role", "texte", "categorie", "sous_categorie", "partenaire", "urgence", "responsable", "resume", "statut"];
    const csv = [cols.join(";"), ...rows.map((r) => cols.map((c) => `"${String(r[c] ?? "").replace(/"/g, '""')}"`).join(";"))].join("\n");
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" })); a.download = "signalements.csv"; a.click();
  };
}

// ---------- Routeur ----------
let cleanup = null;
function route() {
  if (cleanup) { cleanup(); cleanup = null; }
  const h = location.hash.slice(1);
  window.scrollTo(0, 0);
  cleanup = ({ signaler: vSignaler, ecran: vEcran, poste: vPoste, bilan: vBilan, admin: vAdmin }[h] || vAccueil)() || null;
}
window.addEventListener("hashchange", route);
await api.load(); api.live(); route();
</script>
